<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless Nightmare Ritual</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main-container">
    <div class="content">
      <div class="game-section">
        <iframe src="../menu/menu.html"></iframe>
      </div>
      
      <div class="stats-section">
        <div class="stats-header">
          <h2>Registro del Ritual</h2>
          <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        </div>
        <p id="welcome-user" class="welcome-text"></p>
        
        <div class="stats-grid">
          <div class="stat-item">
            <h3>Cartas Obtenidas</h3>
            <p class="placeholder">Próximamente</p>
          </div>
          
          <div class="stat-item">
            <h3>Secretos Obtenidos</h3>
            <p class="placeholder">Próximamente</p>
          </div>
          
          <div class="stat-item">
            <h3>Tiempo de Juego</h3>
            <p class="placeholder">Próximamente</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="main.js"></script>
</body>
</html>
