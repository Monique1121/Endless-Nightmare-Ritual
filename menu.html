<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENDLESS NIGHTMARE RITUAL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=VT323&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      font-family: 'VT323', monospace;
      background: #000;
      color: #fff;
    }

    /* Fondo animado de partículas */
    .background {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0a0308 0%, #030105 50%, #000 100%);
      z-index: 0;
    }

    .particles {
      position: fixed;
      inset: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(200, 50, 50, 0.8);
      border-radius: 50%;
      animation: float var(--duration) infinite ease-in-out;
      box-shadow: 0 0 4px rgba(200, 50, 50, 0.6);
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0;
      }
      50% {
        transform: translate(var(--tx), var(--ty)) scale(1.5);
        opacity: 1;
      }
    }

    /* Viñeta oscura */
    .vignette {
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 300px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 2;
    }

    /* Container principal */
    .menu-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 40px;
    }

    /* Logo del juego */
    .game-logo {
      text-align: center;
      margin-bottom: 60px;
      animation: glitch 3s infinite;
    }

    .game-logo h1 {
      font-family: 'Creepster', cursive;
      font-size: 72px;
      color: #fff;
      text-shadow: 
        0 0 10px rgba(255, 0, 0, 0.8),
        0 0 20px rgba(255, 0, 0, 0.6),
        0 0 30px rgba(255, 0, 0, 0.4),
        3px 3px 0 rgba(180, 0, 0, 0.8);
      letter-spacing: 8px;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .game-logo .subtitle {
      font-size: 24px;
      color: #ff6b6b;
      letter-spacing: 4px;
      opacity: 0.9;
    }

    .version {
      font-size: 16px;
      color: #999;
      margin-top: 10px;
      letter-spacing: 2px;
    }

    /* Efecto glitch */
    @keyframes glitch {
      0%, 90%, 100% {
        transform: translate(0);
        opacity: 1;
      }
      92% {
        transform: translate(-2px, 2px);
        opacity: 0.8;
      }
      94% {
        transform: translate(2px, -2px);
        opacity: 1;
      }
      96% {
        transform: translate(-1px, 1px);
        opacity: 0.9;
      }
    }

    /* Menú de opciones */
    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-btn {
      background: linear-gradient(180deg, rgba(180, 0, 0, 0.2), rgba(100, 0, 0, 0.15));
      border: 2px solid rgba(200, 0, 0, 0.3);
      color: #ffdede;
      font-family: 'VT323', monospace;
      font-size: 28px;
      padding: 16px 60px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 3px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      box-shadow: 
        0 4px 15px rgba(180, 0, 0, 0.2),
        inset 0 -2px 10px rgba(0, 0, 0, 0.5);
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 255, 255, 0.1), 
        transparent);
      transition: left 0.5s;
    }

    .menu-btn:hover {
      background: linear-gradient(180deg, rgba(200, 0, 0, 0.4), rgba(120, 0, 0, 0.3));
      border-color: rgba(255, 0, 0, 0.6);
      color: #fff;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 
        0 6px 25px rgba(200, 0, 0, 0.4),
        inset 0 -2px 10px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(200, 0, 0, 0.3);
    }

    .menu-btn:hover::before {
      left: 100%;
    }

    .menu-btn:active {
      transform: translateY(0) scale(1);
      box-shadow: 
        0 2px 10px rgba(180, 0, 0, 0.3),
        inset 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* Indicador de selección */
    .menu-btn::after {
      content: '►';
      position: absolute;
      left: 20px;
      opacity: 0;
      transition: opacity 0.3s, left 0.3s;
    }

    .menu-btn:hover::after {
      opacity: 1;
      left: 30px;
    }

    /* Pantalla de selección de nivel */
    .level-select {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(5, 2, 3, 0.95);
      animation: fadeIn 0.5s ease-out;
    }

    .level-select.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .level-select h2 {
      font-family: 'Creepster', cursive;
      font-size: 48px;
      color: #ffdede;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
      margin-bottom: 50px;
      letter-spacing: 4px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      max-width: 900px;
      width: 100%;
      margin-bottom: 40px;
    }

    .level-card {
      background: linear-gradient(180deg, rgba(40, 20, 25, 0.8), rgba(20, 10, 15, 0.9));
      border: 2px solid rgba(200, 0, 0, 0.3);
      border-radius: 12px;
      padding: 30px;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .level-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .level-card:hover::before {
      opacity: 1;
    }

    .level-card:hover {
      border-color: rgba(255, 0, 0, 0.6);
      transform: translateY(-5px) scale(1.02);
      box-shadow: 
        0 10px 40px rgba(200, 0, 0, 0.4),
        inset 0 0 30px rgba(255, 0, 0, 0.1);
    }

    .level-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 15px;
    }

    .level-name {
      font-size: 28px;
      text-align: center;
      color: #ffdede;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .level-description {
      font-size: 18px;
      text-align: center;
      color: #ccc;
      opacity: 0.8;
      line-height: 1.4;
    }

    .level-locked {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .back-btn {
      background: linear-gradient(180deg, rgba(80, 80, 80, 0.2), rgba(50, 50, 50, 0.15));
      border: 2px solid rgba(150, 150, 150, 0.3);
      color: #ddd;
      font-family: 'VT323', monospace;
      font-size: 24px;
      padding: 12px 40px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: linear-gradient(180deg, rgba(100, 100, 100, 0.3), rgba(70, 70, 70, 0.2));
      border-color: rgba(200, 200, 200, 0.5);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Pulsación animada */
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    .loading {
      animation: pulse 1.5s infinite;
    }
  </style>
</head>
<body>
  <!-- Fondo animado -->
  <div class="background"></div>
  <div class="particles" id="particles"></div>
  <div class="vignette"></div>

  <!-- Menú Principal -->
  <div class="menu-container" id="mainMenu">
    <div class="game-logo">
      <h1>ENDLESS<br/>NIGHTMARE<br/>RITUAL</h1>
      <div class="subtitle">—·†·—</div>
      <div class="version">VERSIÓN FINAL V1.0</div>
    </div>

    <div class="menu-options">
      <button class="menu-btn" id="btnJugar">Jugar</button>
      <button class="menu-btn" id="btnOpciones">Opciones</button>
      <button class="menu-btn" id="btnCreditos">Créditos</button>
      <button class="menu-btn" id="btnSalir">Salir del Juego</button>
    </div>
  </div>

  <!-- Selección de Nivel -->
  <div class="level-select" id="levelSelect">
    <h2>SELECCIONA UN NIVEL</h2>
    
    <div class="level-grid">
      <div class="level-card" data-level="forest">
        <div class="level-icon">🌲</div>
        <div class="level-name">BOSQUE MALDITO</div>
        <div class="level-description">Un laberinto oscuro donde las sombras cobran vida</div>
      </div>

      <div class="level-card level-locked" data-level="school">
        <div class="level-icon">🏫</div>
        <div class="level-name">ESCUELA ABANDONADA</div>
        <div class="level-description">Próximamente...</div>
      </div>

      <div class="level-card level-locked" data-level="hospital">
        <div class="level-icon">🏥</div>
        <div class="level-name">HOSPITAL ABANDONADO</div>
        <div class="level-description">Próximamente...</div>
      </div>

      <div class="level-card level-locked" data-level="lab">
        <div class="level-icon">🔬</div>
        <div class="level-name">LABORATORIO ABANDONADO</div>
        <div class="level-description">Próximamente...</div>
      </div>
    </div>

    <button class="back-btn" id="btnBack">◄ Regresar</button>
  </div>

  <script src="menu.js"></script>
</body>
</html>
