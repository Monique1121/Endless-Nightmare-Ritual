<!DOCTYPE html>
<html>
    <head>
        <title>Hospital - Endless Nightmare Ritual</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="../lobby/libs/inventory-styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <script src="libs/game_functions.js"></script>
        <script src="libs/Rect.js"></script>
        <script src="libs/Vector.js"></script>
        <script src="libs/GameObject.js"></script>
        <script src="libs/AnimatedObject.js"></script>
        <script src="libs/AnimatedPlayer.js"></script>
        <script src="../lobby/libs/gameState.js"></script>
        <script src="hospital.js"></script>
    </head>

    <body>
        <canvas id="canvas" width="800" height="600" tabindex="0"></canvas>
        
        <!-- INVENTARIO OVERLAY -->
        <div id="inventory-popup" class="inventory-popup hidden">
            <div class="inventory-panel">
                <div class="inventory-header">
                    <h2>INVENTARIO</h2>
                    <div class="inventory-blood">
                        <span>❤</span> <span id="inventory-blood">100 / 100</span>
                    </div>
                </div>
                
                <!-- Sección de Cartas -->
                <div id="inventory-section" class="inventory-section">
                    <h3>Cartas de Demonio</h3>
                    <div id="inventory-cards-list" class="inventory-cards-list">
                        <!-- Las cartas se cargan dinámicamente -->
                    </div>
                </div>
                
                <!-- Sección de Secretos -->
                <div id="secrets-section" class="inventory-section hidden">
                    <h3>Secretos Descubiertos</h3>
                    <div id="secrets-list" class="secrets-list">
                        <!-- Los secretos se cargan dinámicamente -->
                    </div>
                </div>
                
                <div class="inventory-help">
                    <kbd>I</kbd> Cerrar | 
                    <kbd>S</kbd> Ver Secretos | 
                    <kbd>C</kbd> Ver Cartas
                </div>
            </div>
        </div>
        
        <script> main(); </script>
    </body>           
</html>
