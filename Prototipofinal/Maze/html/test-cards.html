<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sistema de Cartas - Endless Nightmare Ritual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #e94560;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #e94560 0%, #c62e48 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        input, select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #e94560;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            margin-right: 10px;
        }

        .log {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #555;
            border-radius: 5px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid transparent;
        }

        .log-entry.success {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .log-entry.error {
            border-left-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        .log-entry.info {
            border-left-color: #2196f3;
            background: rgba(33, 150, 243, 0.1);
        }

        .log-entry.warning {
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-label {
            font-size: 12px;
            color: #888;
        }

        .status-value {
            font-size: 20px;
            font-weight: bold;
            color: #e94560;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .card {
            background: linear-gradient(135deg, #2a2a3e 0%, #1a1a2e 100%);
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(233, 69, 96, 0.3);
        }

        .card.temporary {
            border-color: #ff9800;
            background: linear-gradient(135deg, #3a2a1e 0%, #2a1a0e 100%);
        }

        .card-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .card-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 14px;
        }

        .card-stat {
            display: flex;
            flex-direction: column;
        }

        .card-stat-label {
            font-size: 11px;
            color: #888;
        }

        .card-stat-value {
            font-weight: bold;
            color: #e94560;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 5px;
        }

        .badge.temporary {
            background: #ff9800;
            color: #000;
        }

        .badge.permanent {
            background: #4caf50;
            color: #fff;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group label {
            min-width: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🃏 Test Sistema de Cartas</h1>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Player ID</span>
                <span class="status-value" id="status-player">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">Run Activo</span>
                <span class="status-value" id="status-run">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">Cartas Permanentes</span>
                <span class="status-value" id="status-permanent">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Cartas Temporales</span>
                <span class="status-value" id="status-temp">0</span>
            </div>
        </div>

        <!-- 1. Inicialización -->
        <div class="section">
            <h2>1. Inicialización</h2>
            <div class="input-group">
                <label>Player ID:</label>
                <input type="number" id="player-id-input" value="1" min="1">
                <button onclick="setPlayer()">Establecer Jugador</button>
            </div>
            <div class="button-group">
                <button onclick="ensureDeck()">Verificar/Inicializar Deck</button>
                <button onclick="viewPermanentDeck()">Ver Deck Permanente</button>
                <button onclick="getActiveRun()">Recuperar Run Activo</button>
            </div>
        </div>

        <!-- 2. Gestión de Runs -->
        <div class="section">
            <h2>2. Gestión de Runs</h2>
            <div class="input-group">
                <label>Labyrinth ID:</label>
                <input type="number" id="labyrinth-id-input" value="1" min="1">
            </div>
            <div class="button-group">
                <button onclick="startRun()">Iniciar Run</button>
                <button onclick="viewTemporaryCards()">Ver Cartas Temporales</button>
            </div>
        </div>

        <!-- 3. Recolección de Cartas -->
        <div class="section">
            <h2>3. Recolección de Cartas</h2>
            <div class="input-group">
                <label>Card ID:</label>
                <select id="card-id-select">
                    <optgroup label="Comunes (1-15)">
                        <option value="1">1 - Sombra Voraz</option>
                        <option value="2">2 - Invocar Llamas</option>
                        <option value="3">3 - Latigo Umbral</option>
                        <option value="4">4 - Guardia Abisal</option>
                        <option value="5">5 - Bendicion</option>
                        <option value="10">10 - Asesino</option>
                        <option value="15">15 - Alma Perdida</option>
                    </optgroup>
                    <optgroup label="Intermedias (16-25)">
                        <option value="16">16 - Caballero de Sangre</option>
                        <option value="18">18 - Sacerdotisa Carmesi</option>
                        <option value="20">20 - Guardian Colosal</option>
                        <option value="22">22 - Bestia del Abismo</option>
                        <option value="25">25 - Hechicero Negro</option>
                    </optgroup>
                    <optgroup label="Legendarias (26-35)">
                        <option value="26">26 - Emperador Julian</option>
                        <option value="28">28 - Simmon el Tenebroso</option>
                        <option value="30">30 - Sauron</option>
                        <option value="32">32 - JB el Inmortal</option>
                        <option value="35">35 - Leviatan</option>
                    </optgroup>
                </select>
            </div>
            <div class="button-group">
                <button onclick="collectCard()">Recoger Carta</button>
            </div>
        </div>

        <!-- 4. Finalización -->
        <div class="section">
            <h2>4. Finalización del Run</h2>
            <div class="button-group">
                <button onclick="completeRun()" style="background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);">
                    ✓ Completar Laberinto (Guardar Cartas)
                </button>
                <button onclick="failRun()" style="background: linear-gradient(135deg, #f44336 0%, #c62828 100%);">
                    ✗ Fallar Laberinto (Perder Cartas)
                </button>
            </div>
        </div>

        <!-- 5. Visualización de Cartas -->
        <div class="section">
            <h2>5. Cartas del Jugador</h2>
            <div id="cards-container" class="cards-grid">
                <p style="grid-column: 1/-1; text-align: center; color: #888;">
                    No hay cartas para mostrar
                </p>
            </div>
        </div>

        <!-- Console Log -->
        <div class="section">
            <h2>Console Log</h2>
            <button onclick="clearLog()" style="margin-bottom: 10px;">Limpiar Log</button>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script src="libs/LabyrinthCardSystem.js"></script>
    <script>
        const API_URL = 'http://localhost:3000/api';
        let cardSystem = new LabyrinthCardSystem(API_URL);

        // Inicializar al cargar
        window.addEventListener('load', () => {
            updateStatus();
            log('Sistema iniciado', 'info');
        });

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            
            logDiv.insertBefore(entry, logDiv.firstChild);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            log('Log limpiado', 'info');
        }

        function updateStatus() {
            document.getElementById('status-player').textContent = cardSystem.playerId || '-';
            document.getElementById('status-run').textContent = cardSystem.currentRunId || '-';
        }

        function setPlayer() {
            const playerId = parseInt(document.getElementById('player-id-input').value);
            
            // Simular datos del jugador en localStorage
            localStorage.setItem('player', JSON.stringify({ Player_id: playerId }));
            
            // Reinicializar sistema
            cardSystem = new LabyrinthCardSystem(API_URL);
            
            updateStatus();
            log(`Jugador establecido: ${playerId}`, 'success');
        }

        async function ensureDeck() {
            log('Verificando/inicializando deck...', 'info');
            const result = await cardSystem.ensurePlayerHasDeck();
            
            if (result) {
                log('✅ Deck verificado/inicializado correctamente', 'success');
                await viewPermanentDeck();
            } else {
                log('❌ Error al verificar/inicializar deck', 'error');
            }
        }

        async function startRun() {
            const labyrinthId = parseInt(document.getElementById('labyrinth-id-input').value);
            log(`Iniciando run en laberinto ${labyrinthId}...`, 'info');
            
            const runId = await cardSystem.startRun(labyrinthId);
            
            if (runId) {
                log(`✅ Run iniciado con ID: ${runId}`, 'success');
                updateStatus();
            } else {
                log('❌ Error al iniciar run', 'error');
            }
        }

        async function collectCard() {
            const cardId = parseInt(document.getElementById('card-id-select').value);
            log(`Recolectando carta ${cardId}...`, 'info');
            
            const result = await cardSystem.collectCard(cardId);
            
            if (result) {
                log(`✅ Carta ${cardId} recolectada (TEMPORAL)`, 'success');
                await viewTemporaryCards();
                document.getElementById('status-temp').textContent = cardSystem.temporaryCards.length;
            } else {
                log('❌ Error al recolectar carta', 'error');
            }
        }

        async function completeRun() {
            const timeTaken = 180; // 3 minutos de ejemplo
            log('Completando laberinto...', 'info');
            
            const result = await cardSystem.completeLabyrinth(timeTaken);
            
            if (result) {
                log('🎉 ¡LABERINTO COMPLETADO! Cartas guardadas permanentemente', 'success');
                updateStatus();
                await viewPermanentDeck();
            } else {
                log('❌ Error al completar laberinto', 'error');
            }
        }

        async function failRun() {
            log('Fallando laberinto...', 'warning');
            
            const result = await cardSystem.failLabyrinth();
            
            if (result) {
                log('💀 LABERINTO FALLIDO. Cartas temporales perdidas', 'error');
                updateStatus();
                document.getElementById('cards-container').innerHTML = 
                    '<p style="grid-column: 1/-1; text-align: center; color: #888;">Todas las cartas temporales fueron perdidas</p>';
                document.getElementById('status-temp').textContent = '0';
            } else {
                log('❌ Error al fallar laberinto', 'error');
            }
        }

        async function viewPermanentDeck() {
            log('Cargando deck permanente...', 'info');
            const deck = await cardSystem.getPermanentDeck();
            
            log(`Deck permanente cargado: ${deck.length} cartas`, 'success');
            document.getElementById('status-permanent').textContent = deck.length;
            
            displayCards(deck, false);
        }

        async function viewTemporaryCards() {
            log('Cargando cartas temporales...', 'info');
            const cards = await cardSystem.getTemporaryCards();
            
            log(`Cartas temporales: ${cards.length}`, 'warning');
            document.getElementById('status-temp').textContent = cards.length;
            
            displayCards(cards, true);
        }

        async function getActiveRun() {
            log('Buscando run activo...', 'info');
            const run = await cardSystem.getActiveRun();
            
            if (run) {
                log(`✅ Run activo encontrado: ${run.Run_id} (${run.Labyrinth_name})`, 'success');
                updateStatus();
                await viewTemporaryCards();
            } else {
                log('No hay run activo', 'info');
            }
        }

        function displayCards(cards, isTemporary) {
            const container = document.getElementById('cards-container');
            
            if (cards.length === 0) {
                container.innerHTML = 
                    `<p style="grid-column: 1/-1; text-align: center; color: #888;">
                        No hay cartas ${isTemporary ? 'temporales' : 'permanentes'}
                    </p>`;
                return;
            }
            
            container.innerHTML = cards.map(card => `
                <div class="card ${isTemporary ? 'temporary' : ''}">
                    <div class="card-name">${card.Card_name}</div>
                    <div class="card-stats">
                        <div class="card-stat">
                            <span class="card-stat-label">Costo</span>
                            <span class="card-stat-value">${card.Blood_cost}</span>
                        </div>
                        <div class="card-stat">
                            <span class="card-stat-label">ATK</span>
                            <span class="card-stat-value">${card.Damage}</span>
                        </div>
                        <div class="card-stat">
                            <span class="card-stat-label">HP</span>
                            <span class="card-stat-value">${card.HP}</span>
                        </div>
                    </div>
                    <span class="badge ${isTemporary ? 'temporary' : 'permanent'}">
                        ${isTemporary ? 'TEMPORAL' : 'PERMANENTE'}
                    </span>
                </div>
            `).join('');
        }

        // Sobrescribir showNotification del cardSystem
        cardSystem.showNotification = function(message, type) {
            log(message, type);
        };
    </script>
</body>
</html>
