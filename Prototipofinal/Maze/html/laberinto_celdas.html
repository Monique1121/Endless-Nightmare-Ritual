<!DOCTYPE html>
<html>
    <head>
        <title>Laberinto - Endless Nightmare Ritual</title>
        <link rel="stylesheet" href="../css/styles.css">
        <script src="../js/libs/game_functions.js"></script>
        <script src="../js/libs/Rect.js"></script>
        <script src="../js/libs/Vector.js"></script>
        <script src="../js/libs/GameObject.js"></script>
        <script src="../js/libs/AnimatedObject.js"></script>
        <script src="../js/libs/AnimatedPlayer.js"></script>
        <script src="../../lobby/libs/gameState.js"></script>
        <script src="../js/libs/LabyrinthCardSystem.js"></script>
        <script src="../js/laberinto_celdas.js"></script>
    </head>

    <body>
        <canvas id="canvas"></canvas>
        
        <!-- Popup de cofre -->
        <div id="chestOverlay" class="hidden">
            <div id="chestPopup">
                <p id="chestTitle">COFRE ABIERTO</p>
                
                <!-- Carta recibida -->
                <div class="chest-entry">
                    <p class="chest-entry-label">Carta:</p>
                    <p class="chest-entry-value" id="chestCardName">---</p>
                </div>

                <!-- Sangre recibida -->
                <div class="chest-entry">
                    <p class="chest-entry-label">Sangre: <span id="chestBloodAmount" style="color: #ff0000;">0</span></p>
                </div>

                <!-- Secreto (opcional) -->
                <div id="chestSecret" class="hidden">
                    <p id="chestSecretTitle">---</p>
                    <p id="chestSecretText"></p>
                </div>

                <p id="chestHint">Presiona E para cerrar</p>
            </div>
        </div>
        
        <script> main(); </script>
    </body>           
</html>
