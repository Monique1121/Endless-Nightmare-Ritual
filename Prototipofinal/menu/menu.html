<!DOCTYPE html>
<!-- Menu principal del juego: arranca escena, muestra rol y abre ajustes de musica. -->
<html>
    <head>
        <title>Endless Nightmare Ritual</title>

        <link rel="stylesheet" href="menu-style.css">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <script src="../assets/backgroundMusic.js"></script>
        <script src="menu.js"></script>
    </head>

    <body>

        <div id="gameContainer">

        <!-- Canvas decorativo del menu y boot de la logica principal. -->
        <canvas id="canvas"></canvas>
        <script> main(); </script>

        <h1 id="title">Endless Nightmare Ritual</h1>
        <p id="roleBadge" class="role-badge"></p>

        <!-- Acciones principales del flujo: nueva partida, continuar y ajustes. -->
        <div id = "menu">

            <button class = "button" id="btnNuevaPartida">Nueva partida</button>
            <button class = "button" id="btnContinuar">Continuar</button>
            <button class="button" id="buttonConfig">Ajustes</button>

        </div>


        <!-- Panel reducido de configuracion para el volumen global del juego. -->
        <div id="config" class="settings">

        <h2>Ajustes</h2>

        <label for="volumeMusic">Musica del juego</label>
        <div class="volume-row">
            <input type="range" min="0" max="100" id="volumeMusic" />
            <span id="musicVolumeValue" class="setting-value">45%</span>
        </div>

        <button class="button" id="backButton">Volver</button>

        </div>

        </div>

    </body>
</html>
