<!DOCTYPE html>
<!-- Vista embebida para lanzar el juego principal dentro del portal web. -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <script src="../js/inicio.js"></script>
    <link rel="stylesheet" href="../css/styles.css">

    <style>
        /* Ajustes locales para que el iframe del juego ocupe casi toda la pantalla. */
        body.play-page {
            min-height: 100vh;
            height: auto;
            grid-template-rows: 10vh auto;
            align-items: start;
            justify-items: stretch;
            overflow-x: hidden;
        }

        .play-shell {
            grid-area: main;
            width: 100%;
            max-width: none;
            padding: 12px 20px 32px;
            box-sizing: border-box;
        }

        .game-embed {
            background: linear-gradient(180deg, rgba(31, 6, 6, 0.95), rgba(8, 8, 8, 0.98));
            border: 2px solid rgb(120, 20, 20);
            border-radius: 14px;
            box-shadow: 0 0 24px rgba(177, 20, 20, 0.25);
            overflow: hidden;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .game-frame {
            display: block;
            width: 100%;
            min-height: calc(100vh - 145px);
            border: 0;
            border-radius: 10px;
            background: black;
        }

        .current-link {
            color: rgb(224, 59, 59) !important;
            border-bottom: 2px solid rgb(224, 59, 59);
        }

        @media (max-width: 900px) {
            body.play-page {
                grid-template-rows: auto auto;
            }

            #headerContainer {
                height: auto;
                flex-wrap: wrap;
                justify-content: center !important;
                gap: 10px;
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .play-shell {
                width: 100%;
                padding: 8px 10px 20px;
            }

            .game-frame {
                min-height: calc(100vh - 180px);
            }
        }
    </style>

    <title>Endless Nightmare Ritual | Jugar</title>

</head>


<body class="play-page">

    <!-- Navegacion superior compartida del portal. -->
    <div id="headerContainer" class="d-flex justify-content-between align-items-center px-5">

     <a href="inicio.html" class="logo-link">
        <img src="../assets/logo_2.png" alt="Hexcore Studios" class="logo" >
    </a>
    <h1>|</h1>
    <a href="historia.html">HISTORIA</a>
    <h1>|</h1>
    <a href="tutorial.html">TUTORIAL</a>
    <h1>|</h1>
    <a href="jugar.html" class="current-link">JUGAR</a>
    <h1>|</h1>
    <a href="estadisticas.html">ESTADÍSTICAS</a>
    <h1>|</h1>
    <a href="creditos.html">CRÉDITOS</a>
    <h1>|</h1>
    </div>

    <!-- Contenedor del iframe que monta el juego sin salir del portal. -->
    <main class="play-shell">
        <section class="game-embed">
            <iframe
                class="game-frame"
                src="../../../login/index.html"
                title="Endless Nightmare Ritual"
                loading="eager">
            </iframe>
        </section>
    </main>

</body>


</html>
