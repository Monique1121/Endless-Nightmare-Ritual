<!DOCTYPE html>
<html>
    <head>
        <title>Laberinto - Endless Nightmare Ritual</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background-color: #000;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #canvas {
                background-color: #000;
                width: 100vw;
                height: 100vh;
                object-fit: contain;
            }
        </style>
        <script src="../js/libs/game_functions.js"></script>
        <script src="../js/libs/Rect.js"></script>
        <script src="../js/libs/Vector.js"></script>
        <script src="../js/libs/GameObject.js"></script>
        <script src="../js/libs/AnimatedObject.js"></script>
        <script src="../js/libs/AnimatedPlayer.js"></script>
        <script src="../js/laberinto_celdas.js"></script>
    </head>

    <body>
        <div id="headerContainer">
            <h1>Laberinto</h1>
        </div>
        <canvas id="canvas"></canvas>

        <div id="chestOverlay" class="hidden">
            <div id="chestPopup">

                <p id="chestTitle">Cofre</p>

                
                <div class="chest-entry">
                    <p class="chest-entry-label" id="chestCardName">—</p>
                    <p class="chest-entry-value" id="chestCardDesc"></p>
                </div>

                
                <div class="chest-entry">
                    <p class="chest-entry-label">Blood received: <span id="chestBloodAmount"></span></p>
                </div>

                
                <div id="chestSecret" class="hidden">
                    <p class="chest-entry-label" id="chestSecretTitle">—</p>
                    <p class="chest-entry-value" id="chestSecretText"></p>
                </div>

                <p id="chestHint">E para cerrar</p>

            </div>
        </div>

        <script> main(); </script>
    </body>         
</html>
