<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">

    <!-- CSS --> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- JavaScript --> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- JQUERY -->

    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <script src="../js/effects.js"></script>

    <link rel="stylesheet" href="../css/styles.css">

    <title>Manga Café</title>

    <script>
        $(document).ready(function() {
            $('#contactForm').submit(function(e) {
                e.preventDefault();
                const nombre = $('#nombre').val();
                const email = $('#email').val();
                const mensaje = $('#mensaje').val();
                
                if(nombre && email && mensaje) {
                    alert('¡Gracias ' + nombre + '! Tu mensaje ha sido enviado.');
                    $('#contactForm')[0].reset();
                } else {
                    alert('Por favor completa todos los campos.');
                }
            });
        });
    </script>
    </head>

    <body>
         <div id="headerContainer" class="d-flex justify-content-between align-items-center px-5">

    <a href="index.html">
        <img src="../assets/logo_sin_fondo.png" alt="Manga Café" class="logo" >
    </a>
    <h1>|</h1>
    <a href="index.html">Inicio</a>
    <h1>|</h1>
    <a href="menu.html">Menú</a>
    <h1>|</h1>
    <a href="mangas.html">Mangas</a>
    <h1>|</h1>
    <a href="contacto.html">Contacto</a>
    <h1>|</h1>

    </div>

    <div class="menu">
        <p>Contáctanos</p>
    </div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="contactForm">
                    <div class="mb-3">
                        <label for="nombre" class="form-label text-white">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-white">Email:</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label text-white">Mensaje:</label>
                        <textarea class="form-control" id="mensaje" rows="4" required></textarea>
                    </div>
                    <button type="submit" id="backButton">Enviar Mensaje</button>
                </form>
                <p class="text-white mt-4 text-center">O escríbenos a: <b>contacto@mangacafe.com</b></p>
            </div>
        </div>
    </div>

    <div class="footer">
        <h6>© 2026 Manga Café. Todos los derechos reservados.</h6>
    </div>
