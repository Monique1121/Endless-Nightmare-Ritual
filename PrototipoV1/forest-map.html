<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bosque Maldito - Selección de Nivel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      font-family: 'VT323', monospace;
      background: #000;
      color: #fff;
    }

    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0a0308 0%, #030105 50%, #000 100%);
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 60px rgba(180, 0, 0, 0.2);
      border-radius: 8px;
    }

    /* HUD */
    .hud {
      position: fixed;
      left: 20px;
      top: 20px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.6));
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid rgba(200, 0, 0, 0.3);
      color: #ffdede;
      font-size: 20px;
      line-height: 1.6;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .hud h2 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ff6b6b;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    .hud .controls {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(200, 0, 0, 0.2);
      font-size: 18px;
      color: #ddd;
    }

    .btn-menu {
      position: fixed;
      left: 20px;
      bottom: 20px;
      background: linear-gradient(180deg, rgba(0, 80, 120, 0.4), rgba(0, 60, 100, 0.3));
      border: 2px solid rgba(0, 150, 200, 0.4);
      color: #ddeeff;
      font-family: 'VT323', monospace;
      font-size: 22px;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .btn-menu:hover {
      background: linear-gradient(180deg, rgba(0, 100, 150, 0.5), rgba(0, 80, 120, 0.4));
      border-color: rgba(0, 200, 255, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 150, 200, 0.4);
    }

    /* Prompt de interacción */
    .interact-prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, rgba(20, 10, 15, 0.95), rgba(10, 5, 8, 0.95));
      border: 3px solid rgba(200, 0, 0, 0.5);
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      display: none;
      z-index: 100;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -45%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    .interact-prompt.active {
      display: block;
    }

    .interact-prompt h3 {
      font-size: 32px;
      color: #ff6b6b;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
    }

    .interact-prompt p {
      font-size: 22px;
      color: #ddd;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .interact-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .interact-btn {
      background: linear-gradient(180deg, rgba(180, 0, 0, 0.3), rgba(100, 0, 0, 0.2));
      border: 2px solid rgba(200, 0, 0, 0.4);
      color: #ffdede;
      font-family: 'VT323', monospace;
      font-size: 24px;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .interact-btn:hover {
      background: linear-gradient(180deg, rgba(200, 0, 0, 0.5), rgba(120, 0, 0, 0.3));
      border-color: rgba(255, 0, 0, 0.6);
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(200, 0, 0, 0.4);
    }

    .interact-btn.cancel {
      background: linear-gradient(180deg, rgba(80, 80, 80, 0.3), rgba(50, 50, 50, 0.2));
      border: 2px solid rgba(150, 150, 150, 0.3);
      color: #ddd;
    }

    .interact-btn.cancel:hover {
      background: linear-gradient(180deg, rgba(100, 100, 100, 0.4), rgba(70, 70, 70, 0.3));
      border-color: rgba(200, 200, 200, 0.5);
    }

    /* Viñeta */
    .vignette {
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <canvas id="canvas"></canvas>
  </div>

  <div class="hud">
    <h2>◆ BOSQUE MALDITO</h2>
    <div>Explora y elige tu destino...</div>
    <div class="controls">
      <b>WASD / Flechas</b> - Moverte<br>
      <b>E</b> - Interactuar con edificios
    </div>
  </div>

  <button class="btn-menu" id="menuBtn">◄ Menú Principal</button>

  <div class="interact-prompt" id="interactPrompt">
    <h3 id="buildingName">Edificio</h3>
    <p id="buildingDesc">Descripción del edificio</p>
    <div class="interact-buttons">
      <button class="interact-btn" id="enterBtn">Entrar</button>
      <button class="interact-btn cancel" id="cancelBtn">Cancelar</button>
    </div>
  </div>

  <div class="vignette"></div>

  <script src="forest-map.js"></script>
</body>
</html>
